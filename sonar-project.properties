sonar.projectKey=sqlutionsfatec_analysis-backend
sonar.organization=sqlutionsfatec
sonar.projectName=Analysis Backend
sonar.projectVersion=1.0

# O scanner parte da raiz do repositório, mas analisa somente o backend Django.
sonar.sources=django/api
sonar.tests=django/api/tests,django/api/tests_unit
sonar.exclusions=django/api/tests/**,django/api/tests_unit/**,django/api/migrations/**,django/api/from_scratch/**,**/__pycache__/**
sonar.coverage.exclusions=django/api/settings.py,django/api/asgi.py,django/api/wsgi.py,django/api/urls.py

# TODO: habilitar após os testes gerarem o relatório com pytest-cov.
# sonar.python.coverage.reportPaths=django/coverage.xml
sonar.sourceEncoding=UTF-8
