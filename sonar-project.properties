sonar.projectKey=sqlutionsfatec_analysis-backend1
sonar.organization=sqlutionsfatec-2
sonar.projectName=Analysis Backend
sonar.projectVersion=1.0

sonar.sources=django
sonar.exclusions=**/migrations/**, venv/**, *.html, django/manage.py, *.md, **/data/**, **/__pycache__/**, **/*.pyc
sonar.coverage.exclusions=django/api/settings.py, django/api/asgi.py, django/api/wsgi.py, django/api/models/**, django/api/urls.py

sonar.tests=django/api/tests,django/api/tests_unit
sonar.test.inclusions=django/api/tests/**/*.py,django/api/tests_unit/**/*.py
sonar.python.coverage.reportPaths=django/coverage.xml
