sonar.projectKey=sqlutionsfatec_analysis-backend
sonar.organization=sqlutionsfatec

sonar.projectName=Analysis Backend
sonar.projectVersion=1.0

# Código-fonte da aplicação
sonar.sources=django/api

# Diretório contendo testes
sonar.tests=django/api/tests

# Identificação explícita dos arquivos de teste
sonar.test.inclusions=django/api/tests/**/*.py

# Arquivos que não devem participar da análise de cobertura
sonar.coverage.exclusions=django/api/tests/**,django/api/migrations/**,django/api/asgi.py,django/api/wsgi.py

# Relatório gerado pelo pytest-cov
sonar.python.coverage.reportPaths=django/coverage.xml

# Relatório de execução dos testes
sonar.python.xunit.reportPath=django/test-results.xml

sonar.sourceEncoding=UTF-8
