services:
  # -------------------- Backend --------------------
  backend:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - RUN_SEED=${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../django:/app

  # -------------------- Frontend --------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Usa a variável do .env ou assume 'main' como padrão
        - FRONTEND_BRANCH=${FRONTEND_BRANCH:-main}
        # Substitua pela URL real do repositório de frontend do 5º semestre
        - REPO_URL=https://github.com/SQLutions-FATEC/API-5-Semestre-Frontend
    container_name: nextjs-app
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

  # -------------------- Database --------------------
  postgres:
    build:
      context: ./postgres
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
# -------------------- Monitoring --------------------

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    command:
      - "--web.listen-address=:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      # 🔍 CORRIGIDO: Mudado de prometheus.yml para prometheus.yaml (para bater com a sua pasta)
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - postgres-exporter

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # 🔍 CORRIGIDO: mudado para dashboards_models para ler seus arquivos reais!
      - ./monitoring/grafana/dashboards_models:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgresdata:
  prometheusdata:
  grafanadata:    

