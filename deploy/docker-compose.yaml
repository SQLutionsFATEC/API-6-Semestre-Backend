services:
  # -------------------- Backend --------------------
  backend:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=custom-mysql
      - DB_PORT=3306
      - RUN_SEED=${RUN_SEED:-false}
    depends_on:
      custom-mysql:
        condition: service_healthy
    volumes:
      - ../django:/app

  # -------------------- Frontend --------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Usa a variável do .env ou assume 'main' como padrão
        - FRONTEND_BRANCH=${FRONTEND_BRANCH:-main}
        # Substitua pela URL real do repositório de frontend do 5º semestre
        - REPO_URL=https://github.com/SQLutions-FATEC/API-5-Semestre-Frontend
    container_name: nextjs-app
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

  # -------------------- Database --------------------
  custom-mysql:
    build:
      context: ./mysql
    container_name: mysql-db
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
# -------------------- Monitoring --------------------

  mysql-exporter:
    image: prom/mysqld-exporter:v0.19.0
    container_name: mysql-exporter
    command:
      - "--mysqld.address=custom-mysql:3306"
      - "--mysqld.username=root:${MYSQL_ROOT_PASSWORD}"
    depends_on:
      custom-mysql:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      # 🔍 CORRIGIDO: Mudado de prometheus.yml para prometheus.yaml (para bater com a sua pasta)
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - mysql-exporter

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # 🔍 CORRIGIDO: mudado para dashboards_models para ler seus arquivos reais!
      - ./monitoring/grafana/dashboards_models:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  mysqldata:
  prometheusdata:
  grafanadata:    

