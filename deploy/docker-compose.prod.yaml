version: '3.8'

services:
  # -------------------- Backend (Django + Gunicorn) --------------------
  backend:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-prod
    restart: always
    command: gunicorn api.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000"
    env_file:
      - ../.env
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  # -------------------- Proxy Reverso (Nginx) --------------------
  nginx:
    image: nginx:latest
    container_name: nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"  # LIBERA A PORTA HTTPS PARA O MUNDO EXTERNO
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # MAPEIA OS CERTIFICADOS DA EC2 PARA DENTRO DO CONTAINER
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    depends_on:
      - backend
      - grafana

  # -------------------- Monitoring --------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-prod
    restart: always
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?sslmode=disable

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-prod
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    expose:
      - "9090"
    depends_on:
      - backend
      - postgres-exporter

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana-prod
    restart: always
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards_json:/etc/grafana/dashboards:ro
    expose:
      - "3000"
    depends_on:
      - prometheus

volumes:
  static_volume:
  media_volume:
  prometheusdata:
  grafanadata: