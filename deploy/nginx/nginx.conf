server {
    # Na nuvem, o Nginx interno escuta apenas na porta 80. 
    # O Load Balancer da AWS é quem vai cuidar do HTTPS (443).
    listen 80;
    server_name api-siatt.duckdns.org;

    # -----------------------------------------------------------
    # OTIMIZAÇÕES DE PERFORMANCE (O "Turbinador" do Stalled)
    # -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    # -----------------------------------------------------------

    location / {
        # AQUI MUDOU: No Fargate, os containers compartilham o localhost
        proxy_pass http://127.0.0.1:8000; 
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # O ALB avisa o Nginx que a conexão original veio por HTTPS através deste header
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        # AQUI MUDOU: Apontando para o localhost
        proxy_pass http://127.0.0.1:3000; 
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuração obrigatória para o funcionamento dos WebSockets do Grafana Live
    location /grafana/api/live/ws {
        # AQUI MUDOU: Apontando para o localhost
        proxy_pass http://127.0.0.1:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}