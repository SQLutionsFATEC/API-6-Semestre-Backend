services:
  mysql-test:
    build:
      context: ./mysql

    container_name: sqlutions-mysql-integration-test

    environment:
      MYSQL_DATABASE: api_test_db
      MYSQL_USER: sqlutions_test
      MYSQL_PASSWORD: sqlutions_test_password
      MYSQL_ROOT_PASSWORD: sqlutions_test_root_password
      MYSQL_ROOT_HOST: "%"

    ports:
      - "3307:3306"

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-psqlutions_test_root_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: "no"

  backend-test:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile

    container_name: sqlutions-backend-integration-test

    environment:
      MYSQL_DATABASE: api_test_db
      MYSQL_USER: root
      MYSQL_PASSWORD: sqlutions_test_root_password

      DB_HOST: mysql-test
      DB_PORT: 3306

      DJANGO_SECRET_KEY: integration-test-secret-key
      RUN_SEED: "false"
      ALLOWED_HOSTS: "*"

    depends_on:
      mysql-test:
        condition: service_healthy

    volumes:
      - ../django:/app

    command:
      - python
      - -m
      - pytest
      - api/tests/
      - -v
      - --cov=api
      - --cov-config=.coveragerc
      - --cov-report=term-missing
      - --cov-report=xml:coverage.xml
      - --junitxml=test-results.xml

    restart: "no"
