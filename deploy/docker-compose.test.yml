services:
  postgres-test:
    build:
      context: ./postgres

    container_name: sqlutions-postgres-integration-test

    environment:
      POSTGRES_DB: api_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration_test_password

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d api_test_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: "no"

  backend-test:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile

    container_name: sqlutions-backend-integration-test

    environment:
      DB_NAME: api_test_db
      DB_USER: postgres
      DB_PASSWORD: integration_test_password
      DB_HOST: postgres-test
      DB_PORT: 5432

      DJANGO_SECRET_KEY: integration-test-secret-key
      RUN_SEED: "false"
      ALLOWED_HOSTS: "*"

    depends_on:
      postgres-test:
        condition: service_healthy

    volumes:
      - ../django:/app

    command:
      - python
      - -m
      - pytest
      - api/tests/
      - -v
      - --cov=api
      - --cov-config=.coveragerc
      - --cov-report=term-missing
      - --cov-report=xml:coverage.xml
      - --junitxml=test-results.xml

    restart: "no"