# docker-compose.test.yml
# Ambiente isolado de testes de integração — DevOps SCRUM-88
# Uso:
#   docker compose -f deploy/docker-compose.test.yml --env-file deploy/.env up --build --abort-on-container-exit
#   docker compose -f deploy/docker-compose.test.yml down -v

services:
  mysql-test:
    build:
      context: ./mysql
    container_name: mysql-test-db
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"   # Porta diferente da 3306 (dev) — evita conflito
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-test:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-test-app
    env_file:
      - .env
    environment:
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=mysql-test
      - DB_PORT=3306
      - RUN_SEED=false
    depends_on:
      mysql-test:
        condition: service_healthy
    volumes:
      - ../django:/app
    command: >
      sh -c "
        python manage.py smart_migrate &&
        python -m pytest api/tests/ etl/tests/test_extraction.py -v --cov=api --cov=etl --cov-report=term-missing --cov-report=xml
      "