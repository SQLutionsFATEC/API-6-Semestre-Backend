# docker-compose.test.yml
# Ambiente isolado de testes de integração — DevOps SCRUM-88
# Uso:
#   docker compose -f deploy/docker-compose.test.yml --env-file deploy/.env up --build --abort-on-container-exit
#   docker compose -f deploy/docker-compose.test.yml down -v

services:
  postgres-test:
    build:
      context: ./postgres
    container_name: postgres-test-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"   # Porta diferente da 5432 (dev) - evita conflito
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-test:
    build:
      context: ../django
      dockerfile: ../deploy/backend/Dockerfile
    container_name: django-test-app
    env_file:
      - .env
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - RUN_SEED=false
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ../django:/app
    command: >
      sh -c "
        python manage.py smart_migrate &&
        python -m pytest api/tests/ etl/tests/test_extraction.py -v --cov=api --cov=etl --cov-report=term-missing --cov-report=xml
      "