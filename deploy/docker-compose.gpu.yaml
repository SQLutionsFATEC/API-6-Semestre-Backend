services:
  llama-cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    gpus: all
    command:
      - --model
      - /models/${LLAMA_CPP_MODEL_FILE:-nomic-embed-text-v1.5.Q4_K_M.gguf}
      - --embedding
      - --n-gpu-layers
      - "${LLAMA_CPP_GPU_LAYERS:-99}"
      - --batch-size
      - "${LLAMA_CPP_BATCH_SIZE:-2048}"
      - --ubatch-size
      - "${LLAMA_CPP_UBATCH_SIZE:-2048}"
      - --threads
      - "${LLAMA_CPP_THREADS:-8}"
      - --threads-batch
      - "${LLAMA_CPP_THREADS_BATCH:-8}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
