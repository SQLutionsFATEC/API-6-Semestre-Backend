name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop-1
      - develop-2
      - develop-3

  pull_request:
    branches:
      - main
      - develop-1
      - develop-2
      - develop-3
    types:
      - opened
      - synchronize
      - reopened

  schedule:
    - cron: "0 2 * * 6"

jobs:
  sonarcloud:
    name: Integration Tests and SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integration test images
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            build

      - name: Start PostgreSQL test database
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            up \
            -d \
            --wait \
            postgres-test

      - name: Run backend integration tests
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            run \
            --rm \
            backend-test

      - name: Verify generated reports
        run: |
          test -f django/coverage.xml
          test -f django/test-results.xml

          echo "Integration test reports generated successfully."

          ls -lh \
            django/coverage.xml \
            django/test-results.xml

      - name: Stop integration test environment
        if: always()
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            down \
            -v \
            --remove-orphans

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
