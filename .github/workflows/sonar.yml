name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop-1
      - develop-2
      - develop-3

  pull_request:
    branches:
      - main
      - develop-1
      - develop-2
      - develop-3
    types:
      - opened
      - synchronize
      - reopened

  schedule:
    - cron: "0 2 * * 6"

jobs:
  sonarcloud:
    name: Integration Tests and SonarCloud
    runs-on: ubuntu-latest
    
    # 1. Cria um banco de dados temporário no GitHub para os testes rodarem
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: api_db
          POSTGRES_USER: api_user
          POSTGRES_PASSWORD: senha_padrao
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build integration test images
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            build

      - name: Start PostgreSQL test database
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            up \
            -d \
            --wait \
            postgres-test

      - name: Enable pgvector extension
        env:
          PGPASSWORD: senha_padrao
        run: |
          psql -h localhost -U api_user -d api_db -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # --- 3. RUN TESTS & GENERATE XML ---
      - name: Run tests and generate coverage report
        env:
          DB_HOST: localhost
          POSTGRES_DB: api_db
          POSTGRES_USER: api_user
          POSTGRES_PASSWORD: senha_padrao
          DJANGO_SECRET_KEY: 'test-secret-key-for-github-actions'
      - name: Run backend integration tests
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            run \
            --rm \
            backend-test

      - name: Verify generated reports
        run: |
          test -f django/coverage.xml
          test -f django/test-results.xml

          echo "Integration test reports generated successfully."

          ls -lh \
            django/coverage.xml \
            django/test-results.xml

      - name: Stop integration test environment
        if: always()
        run: |
          docker compose \
            -f deploy/docker-compose.test.yml \
            down \
            -v \
            --remove-orphans

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
