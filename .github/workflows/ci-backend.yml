name: Backend CI

on:
  push:
    branches:
      - main
      - "develop-*"
  pull_request:
    branches:
      - main
      - "develop-*"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-build:
    name: "Estágio 1: qualidade e validação"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      MYSQL_PASSWORD: ci-only-password

    steps:
      - name: Checkout do código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "flake8>=7.0,<8.0"

      - name: Executar análise estática com Flake8
        run: python -m flake8 . --config=../.flake8

      - name: Validar configuração do Django
        run: python manage.py check

      # TODO: habilitar esta etapa quando os testes unitários forem implementados.
      # O caminho e o comando devem ser revistos conforme a estrutura final da suíte.
      # - name: Executar testes unitários
      #   run: python -m pytest api/tests_unit/ -v

  secondary-build:
    name: "Estágio 2: integração e SonarCloud"
    runs-on: ubuntu-latest
    needs: commit-build
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # TODO: habilitar os blocos abaixo quando os testes de integração estiverem prontos.
      # Antes disso, adapte deploy/docker-compose.test.yml para remover as referências
      # herdadas a smart_migrate e ao módulo etl e confirme a geração de coverage.xml.
      #
      # - name: Criar arquivo de ambiente para os testes
      #   shell: bash
      #   run: |
      #     cat > deploy/.env <<'EOF'
      #     MYSQL_USER=api_ci
      #     MYSQL_PASSWORD=ci-only-password
      #     MYSQL_DATABASE=api_db
      #     MYSQL_ROOT_PASSWORD=ci-only-root-password
      #     DJANGO_SECRET_KEY=ci-only-secret-key
      #     RUN_SEED=false
      #     EOF
      #
      # - name: Executar testes de integração com Docker Compose
      #   working-directory: deploy
      #   run: docker compose -f docker-compose.test.yml --env-file .env up --build --abort-on-container-exit --exit-code-from backend-test
      #
      # - name: Encerrar ambiente de testes
      #   working-directory: deploy
      #   if: always()
      #   run: docker compose -f docker-compose.test.yml --env-file .env down -v --remove-orphans
      #
      # - name: Ajustar caminho do relatório de cobertura
      #   shell: bash
      #   run: sed -i "s|<source>.*</source>|<source>${GITHUB_WORKSPACE}/django</source>|g" django/coverage.xml

      - name: Executar análise no SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0

      - name: Informar ausência do token do SonarCloud
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SonarCloud não executado porque o secret SONAR_TOKEN não está disponível."
